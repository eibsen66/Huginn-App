<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Huginn Connectivity Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header>
      <p class="eyebrow">DEV SETTINGS TRANSFER COURIER</p>
      <h1>HUGINN CONNECTIVITY TEST</h1>
    </header>

    <section class="context" aria-label="Browser context">
      <div><span>PAGE ORIGIN</span><output id="page-origin"></output></div>
      <div><span>SECURE CONTEXT</span><output id="secure-context"></output></div>
      <div><span>LOCAL TIME</span><output id="local-time"></output></div>
    </section>

    <section class="actions" aria-label="Huginn API tests">
      <button id="ping-button" type="button">PING HUGINN</button>
      <button id="info-button" type="button">GET HUGINN INFO</button>
      <button id="config-button" type="button">GET HUGINN CONFIG</button>
      <button id="cached-info-button" class="secondary" type="button">SHOW CACHED INFO</button>
      <button id="cached-config-button" class="secondary" type="button">SHOW CACHED CONFIG</button>
      <button id="settings-import-button" class="secondary" type="button">Import Huginn settings file</button>
      <input id="settings-file-input" type="file" accept=".JSN,.jsn,application/json" hidden>
      <button id="settings-verify-button" class="secondary" type="button">Verify with HuginnEIS</button>
      <button id="settings-preview-button" class="secondary" type="button" disabled>Preview settings changes</button>
      <button id="settings-apply-button" type="button" hidden disabled>Apply settings to HuginnEIS</button>
      <button id="settings-preview-cancel-button" class="secondary" type="button" hidden>CANCEL</button>
      <button id="clear-button" class="secondary" type="button">CLEAR RESULT</button>
    </section>

    <section class="result-panel" aria-live="polite" aria-label="Test result">
      <h2 id="result-title">READY</h2>
      <p id="result-summary">Choose a read-only Huginn API test.</p>
      <dl id="result-fields" class="result-fields" hidden></dl>
      <pre id="result-json" hidden></pre>
      <pre id="result-diagnostics" hidden></pre>
    </section>
  </main>
  <dialog id="settings-apply-confirmation" aria-labelledby="settings-apply-confirmation-title">
    <h2 id="settings-apply-confirmation-title">Confirm settings apply</h2>
    <p>Apply these device-previewed settings changes to HuginnEIS?</p>
    <dl id="settings-apply-confirmation-changes" class="result-fields"></dl>
    <form method="dialog" class="dialog-actions">
      <button class="secondary" type="submit">CANCEL</button>
      <button id="settings-apply-confirmation-button" type="button">Apply settings</button>
    </form>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
